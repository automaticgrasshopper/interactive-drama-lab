<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>生产后台</title>
<style>
:root{--bg:#f2f4f8;--panel:#fff;--ink:#222839;--muted:#8a92a6;--line:#e1e5ed;--brand:#6c4cff;--ok:#169c68;--warn:#d8871c;--danger:#d94848}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:0 auto;padding:34px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.head h1{margin:0;font-size:34px}.head p{margin:8px 0 0;color:var(--muted)}.status{padding:8px 13px;border-radius:999px;background:#e8f7f1;color:var(--ok);font-weight:700}.grid{display:grid;grid-template-columns:1.05fr .95fr;gap:22px}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px rgba(32,40,70,.05)}h2{margin:0 0 18px;font-size:20px}.field{margin:0 0 16px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:700}.field input,.field select{width:100%;height:44px;padding:0 13px;border:1px solid #d9deea;border-radius:11px;background:#fff;font-size:14px;outline:none}.field input:focus,.field select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(108,76,255,.12)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toggle{display:flex;gap:10px;align-items:center;margin:12px 0;color:#4d566a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;border-radius:11px;padding:11px 17px;font-weight:750;cursor:pointer;background:#edf0f6;color:#31394c}.btn.pri{background:var(--brand);color:#fff}.btn.dark{background:#222839;color:#fff}.btn.danger{background:#fff0f0;color:var(--danger);border:1px solid #f2caca}.btn.small{padding:8px 11px;border-radius:9px;font-size:12px}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.metric{padding:15px;border-radius:14px;background:#f6f7fb}.metric b{display:block;font-size:20px}.metric span{font-size:12px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:13px;transition:.15s}.item.selected{border-color:var(--brand);background:#f7f5ff;box-shadow:0 0 0 3px rgba(108,76,255,.08)}.itemmain{flex:1;min-width:0}.item b{display:block;overflow:hidden;text-overflow:ellipsis}.item small{display:block;margin-top:4px;color:var(--muted)}.itemacts{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.msg{min-height:22px;margin-top:12px;font-size:13px;color:var(--muted);white-space:pre-wrap}.msg.err{color:#c2413b}.msg.ok{color:var(--ok)}.library{margin-top:22px}.library p{margin:-8px 0 18px;color:var(--muted);font-size:13px}.assetgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.assetbtn{min-height:62px;border:1px solid var(--line);border-radius:13px;background:#f7f8fb;color:#30384b;font-weight:750;cursor:pointer;padding:10px}.assetbtn:hover{border-color:var(--brand);background:#f3f0ff}.mask{display:none;position:fixed;inset:0;z-index:80;background:rgba(20,25,40,.48);padding:28px;align-items:flex-start;justify-content:center;overflow:auto}.dialog{width:min(960px,100%);background:#fff;border-radius:18px;padding:22px 26px;box-shadow:0 18px 60px rgba(20,25,40,.28)}.dialoghead{display:flex;align-items:center;gap:10px;margin-bottom:12px}.dialoghead h2{margin:0}.dialog pre{margin:0;max-height:72vh;overflow:auto;white-space:pre-wrap;font:13px/1.8 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#3a4255;background:#fafbfc;border:1px solid #edf0f5;border-radius:12px;padding:18px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row,.summary{grid-template-columns:1fr}.assetgrid{grid-template-columns:1fr 1fr}.shell{padding:18px}.item{align-items:flex-start;flex-direction:column}.itemacts{justify-content:flex-start}}
.manager-tabs{display:flex;gap:8px;margin-top:24px;padding:5px;background:#f0f2f7;border-radius:13px}.manager-tab{flex:1;border:0;border-radius:10px;padding:11px 12px;background:transparent;color:#6c758a;font-weight:800;cursor:pointer}.manager-tab.active{background:#fff;color:#242b3b;box-shadow:0 2px 10px rgba(25,32,55,.09)}.manager-panel{display:none;margin-top:16px}.manager-panel.active{display:block}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:999px;background:#eef1f6;color:#667086;font-size:11px;font-weight:750}.badge.ok{background:#e8f7f1;color:#16865d}.badge.warn{background:#fff2df;color:#b46b10}.badge.cg{background:#eaf3ff;color:#326fc4}.sectionnote{margin:-10px 0 14px;color:var(--muted);font-size:12px}.loghead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.loghead h2{margin:0}.logmeta{color:var(--muted);font-size:12px}.logconsole{margin:0;min-height:260px;max-height:560px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#11161e;color:#d8deea;border:1px solid #232b38;border-radius:14px;padding:18px;font:12.5px/1.75 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}.logempty{color:#8590a4}.loglive{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:#e8f7f1;color:#16865d;font-size:11px;font-weight:800}.loglive:before{content:'';width:7px;height:7px;border-radius:50%;background:#22a875;box-shadow:0 0 0 4px rgba(34,168,117,.12)}
</style>
</head>
<body>
<main class="shell">
  <header class="head"><div><h1>⚙️ 生产后台</h1><p>模型配置、任务状态与本机后台管理。</p></div><div id="health" class="status">连接中</div></header>
  <section class="grid">
    <div class="card">
      <h2>模型与保存策略</h2>
      <div class="field"><label>服务商</label><select id="provider"><option value="openrouter">OpenRouter</option></select></div>
      <div class="field"><label>API Base URL</label><input id="base" value="https://openrouter.ai/api/v1"></div>
      <div class="field"><label>OpenRouter API Key</label><input id="key" type="password" placeholder="未修改时留空；密钥只保存在本机 .runtime/"></div>
      <div class="row"><div class="field"><label>生成模型</label><input id="model" list="modelOptions" placeholder="可下拉选择，也可直接输入模型 ID"><datalist id="modelOptions">
        <option value="anthropic/claude-sonnet-5" label="Anthropic · Claude Sonnet 5 · 推荐"></option>
        <option value="anthropic/claude-opus-4.8" label="Anthropic · Claude Opus 4.8 · 最强"></option>
        <option value="anthropic/claude-sonnet-4.6" label="Anthropic · Claude Sonnet 4.6 · 均衡"></option>
        <option value="anthropic/claude-haiku-4.5" label="Anthropic · Claude Haiku 4.5 · 快速"></option>
        <option value="openai/gpt-5.6-sol" label="OpenAI · GPT-5.6 Sol · 旗舰"></option>
        <option value="openai/gpt-5.6-terra" label="OpenAI · GPT-5.6 Terra · 均衡"></option>
        <option value="openai/gpt-5.6-luna" label="OpenAI · GPT-5.6 Luna · 快速"></option>
        <option value="openai/gpt-5.4-mini" label="OpenAI · GPT-5.4 Mini · 经济"></option>
      </datalist></div><div class="field"><label>校验模型</label><input id="validator" placeholder="留空则与生成模型相同"></div></div>
      <div class="field"><label>图像模型</label><input id="imageModel" value="google/gemini-2.5-flash-image" placeholder="google/gemini-2.5-flash-image"></div>
      <label class="toggle"><input id="autoCommit" type="checkbox" checked> 每次项目保存后自动创建本地 Git 提交</label>
      <div class="actions"><button class="btn pri" id="save">保存设置</button><button class="btn dark" id="lockConfig">锁定配置</button><button class="btn" id="unlockConfig">解锁</button><button class="btn" id="clearKey">清除密钥</button></div>
      <div id="settingsMsg" class="msg"></div>
    </div>
    <div class="card">
      <h2>任务管理</h2>
      <div class="actions"><button class="btn danger" id="restart">重启后台</button><button class="btn danger" id="forceExitBackend">强制退出后台</button></div>
      <div id="gitMsg" class="msg"></div>
      <div class="manager-tabs"><button class="manager-tab active" data-manager-tab="current">本次</button><button class="manager-tab" data-manager-tab="tasks">全部任务</button></div>
      <div id="panelCurrent" class="manager-panel active"><p class="sectionnote">显示本次打开后生成的任务，以及尚未进入仓库的本地记录。</p><div id="currentTasks" class="list"><div class="empty">本次还没有生成任务。</div></div></div>
      <div id="panelTasks" class="manager-panel"><p class="sectionnote">显示全部本地任务和仓库只读归档。</p><div id="tasks" class="list"><div class="empty">暂无后台任务。</div></div></div>
    </div>
  </section>
  <section class="card library" id="productionLogCard">
    <div class="loghead">
      <h2>生成日志</h2>
      <span class="loglive" id="productionLogLive">等待任务</span>
      <span class="logmeta" id="productionLogMeta">开始新任务后自动实时打印；无运行任务时可点「详情」查看历史日志。</span>
      <button class="btn small" id="productionLogCopy" style="margin-left:auto">复制日志</button>
    </div>
    <pre class="logconsole"><span class="logempty" id="productionLogText">尚未选择任务。</span></pre>
  </section>
  <section class="card library">
    <h2>规则与执行卡</h2>
    <p>生产规则统一在后台查看；内容直接读取工作台当前使用的版本。</p>
    <div class="assetgrid">
      <button class="assetbtn" data-file="影视互动游戏故事节奏验证.html" data-script="rulebook" data-title="互动影视设计规则书">大纲规则书</button>
      <button class="assetbtn" data-file="影视互动游戏故事节奏验证.html" data-script="execcard" data-title="大纲生成执行卡">大纲执行卡</button>
      <button class="assetbtn" data-file="分镜工作台.html" data-script="execcard" data-title="剧本转分镜执行卡">剧本转分镜执行卡</button>
      <button class="assetbtn" data-file="分镜工作台.html" data-script="charcard" data-title="人物三视图骨架">人物三视图骨架</button>
      <button class="assetbtn" data-file="分镜工作台.html" data-script="scenecard" data-title="场景图骨架">场景图骨架</button>
    </div>
  </section>
</main>
<div id="assetMask" class="mask">
  <div class="dialog">
    <div class="dialoghead"><h2 id="assetTitle">执行卡</h2><span id="assetMeta" style="font-size:12px;color:var(--muted)"></span><button class="btn" id="assetCopy" style="margin-left:auto">复制</button><button class="btn" id="assetClose">关闭</button></div>
    <pre id="assetBody"></pre>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
async function api(path,opt){const r=await fetch(path,opt);const type=r.headers.get('content-type')||'';if(!type.includes('application/json')){throw new Error('当前 8000 端口不是工作台后端，请关闭旧服务后用“启动.command”重新启动')}const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.error||'请求失败');return j}
function msg(id,text,type){const el=$(id);el.textContent=text||'';el.className='msg '+(type||'')}
function setModelValue(value){$('model').value=value||''}
let taskCache=[];let detectedSystem='';let backendCapabilities=[];let selectedLogTask=null;let logPollTimer=0;let lastLogText='';let lastLogTask=null;let logFetchFailures=0;
function systemLabel(value){return({Darwin:'macOS',Windows:'Windows',Linux:'Linux'})[value]||value||(/Mac/i.test(navigator.platform)?'macOS':(/Win/i.test(navigator.platform)?'Windows':'当前系统'))}
function currentProject(){try{const current=JSON.parse(sessionStorage.getItem('idl_current_project')||'null');if(current)return current;const active=JSON.parse(localStorage.getItem('idl_active_backend_task_v1')||'null');return active&&active.project_id?{id:active.project_id}:null}catch(e){return null}}
async function load(){try{const h=await api('/api/health');detectedSystem=h.system||'';backendCapabilities=h.capabilities||[];$('restart').textContent='重启后台 · '+systemLabel(detectedSystem);$('forceExitBackend').disabled=backendCapabilities.indexOf('force_backend_exit')<0;$('forceExitBackend').title=$('forceExitBackend').disabled?'当前后台版本较旧，请先点“重启后台”加载新版本':'强制结束整个后台进程';if((h.api_version||0)<6)throw new Error('后台服务仍是旧版本，请点击红色“重启后台”');const [s,t]=await Promise.all([api('/api/settings'),api('/api/tasks')]);$('health').textContent=s.settings.config_locked?'后端已锁定':'后端已连接';const v=s.settings;$('provider').value=v.provider;$('base').value=v.base_url;setModelValue(v.model);$('validator').value=v.validator_model;$('imageModel').value=v.image_model||'google/gemini-2.5-flash-image';$('autoCommit').checked=v.auto_commit;$('key').placeholder=v.api_key_configured?'已配置；输入新值可替换':'请输入 OpenRouter API Key';['provider','base','model','validator','imageModel','key','autoCommit'].forEach(id=>$(id).disabled=!!v.config_locked);$('save').disabled=!!v.config_locked;$('lockConfig').style.display=v.config_locked?'none':'inline-block';$('unlockConfig').style.display=v.config_locked?'inline-block':'none';$('clearKey').disabled=!!v.config_locked;taskCache=t.tasks||[];renderTasks('currentTasks',currentTaskItems());renderTasks('tasks',taskCache);autoSelectProductionLog()}catch(e){$('restart').textContent='重启后台 · '+systemLabel(detectedSystem);$('health').textContent='后端需重启';$('health').style.background='#fff0e0';$('health').style.color='#b96812';msg('gitMsg',e.message,'err')}}
function currentTaskItems(){const current=currentProject();return taskCache.filter(t=>!t.read_only&&((current&&t.project_id===current.id)||t.git_state!=='已在 Git'))}
function statusText(s){return({running:'运行中',stopping:'停止中',stopped:'已停止',completed:'已完成',failed:'失败',disconnected:'连接中断',archived:'Git 归档'})[s]||s||'未知'}
function activeTask(){return taskCache.find(t=>t.status==='running'||t.status==='stopping')||null}
function autoSelectProductionLog(){
  const active=activeTask();
  if(active){selectedLogTask={projectId:active.project_id,runId:active.run_id};refreshProductionLog();return}
  if(selectedLogTask&&taskCache.some(t=>t.project_id===selectedLogTask.projectId&&t.run_id===selectedLogTask.runId)){refreshProductionLog();return}
  selectedLogTask=null;renderProductionLog(null)
}
function selectProductionLog(projectId,runId,scroll){selectedLogTask={projectId,runId};refreshProductionLog();if(scroll)$('productionLogCard').scrollIntoView({behavior:'smooth',block:'start'})}
async function refreshProductionLog(){
  try{
    // 每轮先看全局是否出现运行任务；一旦有，强制抢回并锁定到该任务，不能被历史详情覆盖。
    const list=await api('/api/tasks');taskCache=list.tasks||taskCache;
    const active=activeTask();if(active)selectedLogTask={projectId:active.project_id,runId:active.run_id};
    if(!selectedLogTask){renderProductionLog(null);return}
    const j=await api('/api/tasks/'+encodeURIComponent(selectedLogTask.projectId)+'/'+encodeURIComponent(selectedLogTask.runId));logFetchFailures=0;renderProductionLog(j.task||{});
  }catch(e){
    // 网络/重启瞬断不是生产失败：保留上一帧任务和日志，轮询会自动重连。
    logFetchFailures++;
    const live=$('productionLogLive'),meta=$('productionLogMeta');
    live.textContent='正在重连';
    meta.textContent=(lastLogTask?(lastLogTask.title||lastLogTask.run_id||'当前任务')+' · '+(lastLogTask.phase||'生产中')+' · '+(lastLogTask.progress||0)+'% · ':'')+'连接暂时中断，已重试 '+logFetchFailures+' 次；日志与任务状态均已保留。';
    $('health').textContent='后台重连中';$('health').style.background='#fff2df';$('health').style.color='#b96812';
  }
}
function renderProductionLog(t){
  const textEl=$('productionLogText'),live=$('productionLogLive'),meta=$('productionLogMeta');
  if(!t){live.textContent='等待任务';meta.textContent='开始新任务后自动实时打印；无运行任务时可点「详情」查看历史日志。';textEl.textContent='当前没有运行中的项目，也尚未选择历史任务。';lastLogText='';return}
  lastLogTask=t;
  // 完整后台生产写 production_log；完整剧本忠实导入/旧直连任务写 response_text。两类都必须可见。
  const log=String(t.production_log||t.response_text||'');lastLogText=log;
  live.textContent=(t.status==='running'||t.status==='stopping')?'实时刷新':statusText(t.status);
  $('health').textContent='后端已连接';$('health').style.background='';$('health').style.color='';
  meta.textContent=(t.title||t.run_id||'未命名任务')+' · '+(t.phase||'未进入阶段')+' · '+(t.progress||0)+'% · '+(t.updated_at||'');
  textEl.textContent=log||('（暂无生成日志。旧任务不会补录；新任务开始后会在这里持续打印。）'+(t.error?'\n\n错误：'+t.error:''));
  const box=textEl.parentElement;if(t.status==='running'||t.status==='stopping')box.scrollTop=box.scrollHeight;
}
function renderTasks(targetId,items){const root=$(targetId);root.innerHTML=items.length?items.map(t=>{const active=t.status==='running'||t.status==='stopping';const gitOk=t.git_state==='已在 Git'||t.git_state==='已本地提交';return `<div class="item"><div class="itemmain"><b>${esc(t.title||t.run_id)}</b><small>${t.input_title&&t.input_title!==t.title?('原始输入：'+esc(t.input_title)+' · '):''}${esc(t.phase)} · ${esc(statusText(t.status))} · ${t.progress||0}% · ${esc(t.updated_at)}</small><div class="badges"><span class="badge ${t.has_cg?'cg':''}">${t.has_cg?'🎨 已有 CG':'无 CG'}</span><span class="badge ${gitOk?'ok':'warn'}">${esc(t.git_state||'未提交')}</span>${t.read_only?'<span class="badge">只读归档</span>':''}</div></div><div class="itemacts">${t.resumable?`<button class="btn pri small" data-task-resume="${esc(t.run_id)}" data-project-id="${esc(t.project_id)}">继续</button>`:''}<button class="btn small" data-task-detail="${esc(t.run_id)}" data-project-id="${esc(t.project_id)}">详情</button>${t.read_only?'':(t.status==='running'?`<button class="btn small" data-task-stop="${esc(t.run_id)}" data-project-id="${esc(t.project_id)}">停止</button>`:'')}${!t.read_only&&!active?`<button class="btn danger small" data-task-delete="${esc(t.run_id)}" data-project-id="${esc(t.project_id)}" data-task-title="${esc(t.title||'')}">删除</button>`:''}</div></div>`}).join(''):'<div class="empty">暂无符合条件的任务。</div>';root.querySelectorAll('[data-task-resume]').forEach(btn=>btn.onclick=()=>resumeTask(btn.dataset.projectId,btn.dataset.taskResume,btn));root.querySelectorAll('[data-task-detail]').forEach(btn=>btn.onclick=()=>showTask(btn.dataset.projectId,btn.dataset.taskDetail));root.querySelectorAll('[data-task-stop]').forEach(btn=>btn.onclick=()=>stopTask(btn.dataset.projectId,btn.dataset.taskStop));root.querySelectorAll('[data-task-delete]').forEach(btn=>btn.onclick=()=>deleteTask(btn.dataset.projectId,btn.dataset.taskDelete,btn.dataset.taskTitle))}
async function resumeTask(projectId,runId,btn){const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='继续中…'}try{await api('/api/tasks/'+encodeURIComponent(projectId)+'/'+encodeURIComponent(runId)+'/resume',{method:'POST'});try{sessionStorage.setItem('idl_current_project',JSON.stringify({id:projectId,opened_at:new Date().toISOString()}));localStorage.setItem('idl_active_backend_task_v1',JSON.stringify({project_id:projectId,run_id:runId}))}catch(e){}msg('gitMsg','已从最近断点继续，完成过的内容不会重复生成。','ok');await load()}catch(e){msg('gitMsg',e.message,'err');if(btn){btn.disabled=false;btn.textContent=old||'继续'}}}
async function showTask(projectId,runId){
  try{
    const list=await api('/api/tasks');taskCache=list.tasks||taskCache;const active=activeTask();
    if(active){
      selectedLogTask={projectId:active.project_id,runId:active.run_id};await refreshProductionLog();
      const same=String(active.project_id)===String(projectId)&&String(active.run_id)===String(runId);
      msg('gitMsg',same?'':'当前有正在进行中的项目，生成日志已锁定为实时打印，完成后才能查看其他任务详情。',same?'':'err');
      $('productionLogCard').scrollIntoView({behavior:'smooth',block:'start'});return;
    }
    // 没有运行项目：详情就是在同一个生成日志框查看该任务，不弹 JSON。
    msg('gitMsg','', '');selectProductionLog(projectId,runId,true);
  }catch(e){msg('gitMsg',e.message,'err')}
}
async function stopTask(projectId,runId){if(!confirm('停止这项后台生产任务？'))return;try{await api('/api/tasks/'+encodeURIComponent(projectId)+'/'+encodeURIComponent(runId)+'/stop',{method:'POST'});msg('gitMsg','已发送停止请求，任务会在当前步骤结束后停下。','ok');setTimeout(load,3200)}catch(e){msg('gitMsg',e.message,'err')}}
async function removeLocalTask(runId,title){
  // 同一项目的一套数据必须联动删除：编剧记录 + 绑定分镜记录 + 对应 CG 图片缓存。
  try{const k='gen_history_v1';const a=JSON.parse(localStorage.getItem(k)||'[]').filter(r=>(r.runId||'')!==runId&&(r.title||'')!==title);localStorage.setItem(k,JSON.stringify(a))}catch(e){}
  let dropped=[];
  try{
    const k='sb_history_v1',a=JSON.parse(localStorage.getItem(k)||'[]'),prefix='bs:'+String(title||'')+'|';
    const keep=a.filter(r=>{const linked=String(r.boundStory||'')===String(title||'')||String(r.mergeKey||'').indexOf(prefix)===0;if(linked)dropped.push(r);return !linked});
    localStorage.setItem(k,JSON.stringify(keep));
  }catch(e){}
  // 分镜 CG 存在 IndexedDB sb_cg/img；按被删记录 id 前缀清掉，避免元数据删了但图片仍占空间。
  if(dropped.length&&window.indexedDB){
    await new Promise(resolve=>{const q=indexedDB.open('sb_cg',1);q.onerror=()=>resolve();q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains('img'))q.result.createObjectStore('img')};q.onsuccess=()=>{const db=q.result;if(!db.objectStoreNames.contains('img')){db.close();resolve();return}const ids=new Set(dropped.map(r=>String(r.id||'')).filter(Boolean));const tx=db.transaction('img','readwrite'),st=tx.objectStore('img'),cur=st.openCursor();cur.onsuccess=e=>{const c=e.target.result;if(c){for(const id of ids){if(String(c.key).indexOf(id+'|')===0){c.delete();break}}c.continue()}};tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();resolve()}}});
  }
  // 共享数据包台账同步销据；用户单传分镜不在此列。
  try{const k='dp_ledger_v1',m=JSON.parse(localStorage.getItem(k)||'{}');delete m[title];localStorage.setItem(k,JSON.stringify(m))}catch(e){}
  return dropped.length;
}
async function deleteTask(projectId,runId,title){if(!confirm('删除本地任务“'+(title||runId)+'”？\n\n将同时删除该项目的编剧记录、绑定分镜和本机 CG 缓存；用户单传分镜不受影响。\n仓库归档不会在这里修改。'))return;try{await api('/api/tasks/'+encodeURIComponent(projectId)+'/'+encodeURIComponent(runId),{method:'DELETE'});const sbCount=await removeLocalTask(runId,title);msg('gitMsg','本地任务已删除'+(sbCount?'，并清理 '+sbCount+' 条绑定分镜及其 CG。':'。'),'ok');await load()}catch(e){msg('gitMsg',e.message,'err')}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function settingsPayload(){const p={provider:$('provider').value,base_url:$('base').value.trim(),model:$('model').value.trim(),validator_model:$('validator').value.trim(),image_model:$('imageModel').value.trim(),auto_commit:$('autoCommit').checked};if($('key').value.trim())p.api_key=$('key').value.trim();return p}
async function openAsset(btn){try{const html=await fetch(btn.dataset.file).then(r=>{if(!r.ok)throw new Error('资料读取失败');return r.text()});const doc=new DOMParser().parseFromString(html,'text/html');const node=doc.getElementById(btn.dataset.script);if(!node)throw new Error('未找到对应规则内容');const text=(node.textContent||'').trim();$('assetTitle').textContent=btn.dataset.title;$('assetMeta').textContent=text.length+' 字符';$('assetBody').textContent=text;$('assetMask').style.display='flex'}catch(e){msg('gitMsg',e.message,'err')}}
document.querySelectorAll('.assetbtn').forEach(btn=>btn.onclick=()=>openAsset(btn));
document.querySelectorAll('[data-manager-tab]').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('[data-manager-tab]').forEach(x=>x.classList.toggle('active',x===btn));$('panelCurrent').classList.toggle('active',btn.dataset.managerTab==='current');$('panelTasks').classList.toggle('active',btn.dataset.managerTab==='tasks')});
$('assetClose').onclick=()=>{$('assetMask').style.display='none'};
$('assetMask').onclick=e=>{if(e.target===$('assetMask'))$('assetMask').style.display='none'};
$('assetCopy').onclick=async()=>{try{await navigator.clipboard.writeText($('assetBody').textContent);$('assetCopy').textContent='已复制';setTimeout(()=>{$('assetCopy').textContent='复制'},1200)}catch(e){}};
$('productionLogCopy').onclick=async()=>{try{await navigator.clipboard.writeText(lastLogText||$('productionLogText').textContent);$('productionLogCopy').textContent='已复制';setTimeout(()=>{$('productionLogCopy').textContent='复制日志'},1200)}catch(e){}};
$('save').onclick=async()=>{try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(settingsPayload())});$('key').value='';msg('settingsMsg','设置已保存在本机后端。','ok');load()}catch(e){msg('settingsMsg',e.message,'err')}};
$('lockConfig').onclick=async()=>{try{const p=settingsPayload();p.lock=true;await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)});$('key').value='';msg('settingsMsg','配置已锁定。大纲台和分镜台只读使用此配置。','ok');load()}catch(e){msg('settingsMsg',e.message,'err')}};
$('unlockConfig').onclick=async()=>{try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({unlock:true})});msg('settingsMsg','配置已解锁，可以编辑。','ok');load()}catch(e){msg('settingsMsg',e.message,'err')}};
$('clearKey').onclick=async()=>{try{await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({clear_api_key:true})});msg('settingsMsg','本机密钥已清除。','ok');load()}catch(e){msg('settingsMsg',e.message,'err')}};
$('forceExitBackend').onclick=async()=>{if(backendCapabilities.indexOf('force_backend_exit')<0){msg('gitMsg','当前运行的是旧后台版本，请先点“重启后台”加载新版本，再使用强制退出。','err');return}if(!confirm('强制退出整个工作台后台？\n\n后台 Python 进程会直接停止且不会自动重启；运行中任务将标记为已停止，最近检查点保留。之后需要重新双击“启动.command”或“启动.bat”才能使用。'))return;const btn=$('forceExitBackend');btn.disabled=true;btn.textContent='正在退出后台…';try{await api('/api/system/force-exit',{method:'POST'});$('health').textContent='后台已退出';$('health').style.background='#fff0f0';$('health').style.color='#c2413b';msg('gitMsg','后台已强制退出。需要继续使用时，请重新运行启动脚本。','ok');$('restart').disabled=true}catch(e){btn.disabled=false;btn.textContent='强制退出后台';msg('gitMsg',e.message,'err')}};
$('restart').onclick=async()=>{if(!confirm('精准重启这个工作台的本机后台？\n\n系统：'+systemLabel(detectedSystem)+'\n只重启当前工作台端口，不影响其他 Python 服务。'))return;const btn=$('restart');btn.disabled=true;btn.textContent='正在重启…';msg('gitMsg','后台正在退出并以同一解释器、同一端口重新启动…','');try{await api('/api/system/restart',{method:'POST'})}catch(e){msg('gitMsg','当前后台太旧，尚不支持网页重启。请这一次手动重新运行“启动.command”；以后即可使用此按钮。','err');btn.disabled=false;btn.textContent='重启后台 · '+systemLabel(detectedSystem);return}let tries=0;const poll=async()=>{tries++;try{const r=await fetch('/api/health?restart='+Date.now(),{cache:'no-store'});const h=await r.json();if(r.ok&&h.ok&&(h.api_version||0)>=4){window.location.reload();return}}catch(e){}if(tries<40)setTimeout(poll,500);else{msg('gitMsg','后台重启超时，请手动运行“启动.command”。','err');btn.disabled=false;btn.textContent='重启后台 · '+systemLabel(detectedSystem)}};setTimeout(poll,500)};load();logPollTimer=setInterval(refreshProductionLog,1500);
</script>
